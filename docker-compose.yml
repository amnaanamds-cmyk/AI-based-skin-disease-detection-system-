services:
  dermaai:
    build: .
    ports:
      - "8000:8000"
    environment:
      DERMAAI_DB: /data/dermaai_cases.db
      # Serve the models from the host folder, so retraining on the host updates the container's model.
      DERMAAI_MODELS_DIR: /models/trained
      # Set to enable the clinician dashboard at /clinician, e.g. in a .env file.
      DERMAAI_CLINICIAN_TOKEN: ${DERMAAI_CLINICIAN_TOKEN:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    volumes:
      - ./models:/models:ro
      - dermaai-data:/data
    restart: unless-stopped

volumes:
  dermaai-data:
